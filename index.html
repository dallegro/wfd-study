<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFD 191 | 반복 듣기</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="eyebrow">PTE · WRITE FROM DICTATION</div><h1>WFD 191 반복 듣기</h1><div class="muted">하루 10문장 · 원본 음원 · 오프라인 학습</div><label class="language"><span id="languageLabel">언어 / Language / Pinulongan</span><select id="language"><option value="ko">한국어</option><option value="en">English</option><option value="ceb">Cebuano (Bisaya)</option></select></label></header><section class="panel"><div class="row"><label>학습 날짜<select id="day"></select></label><div><small id="range"></small><progress id="progress" max="10" value="0"></progress><small id="progressText"></small></div></div><div class="settings"><label>문장 반복<select id="repeat"><option value="1">1회</option><option value="3" selected>3회</option><option value="5">5회</option><option value="10">10회</option><option value="0">무한</option></select></label><label>재생 속도<select id="speed"><option value="0.7">0.7배</option><option value="0.85">0.85배</option><option value="1" selected>1.0배</option><option value="1.15">1.15배</option></select></label><label>반복 간격<select id="gap"><option value="0.5">0.5초</option><option value="1.5" selected>1.5초</option><option value="3">3초</option><option value="5">5초</option></select></label></div></section><section class="panel"><div class="row"><div id="number"></div><div style="text-align:right"><small id="meta"></small><div id="status">준비</div></div></div><audio id="player" controls preload="metadata" playsinline></audio><div class="row"><button id="play" class="primary">문장 반복 ▶</button><button id="dayPlay">하루 전체 ▶</button><button id="stop">정지</button></div><div class="row" style="margin-top:9px"><button id="prev">이전</button><button id="next">다음</button><button id="shuffle">랜덤</button></div><div class="answer"><button id="reveal" style="width:100%">원문 · 해석 보기</button><div id="answer" class="hidden"><div id="english"></div><div id="korean"></div></div></div></section><section class="panel"><h2>받아쓰기 테스트</h2><textarea id="typed" placeholder="음성을 듣고 영어 문장을 입력해 보세요." autocapitalize="off" autocomplete="off" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button id="check">정답 확인</button><button id="mark">암기 완료 표시</button></div><div id="result" class="muted" aria-live="polite"></div></section><section class="panel"><h2>오늘의 문장</h2><div id="grid"></div></section><footer>출처: 반딧불 교육 11.19 기준 WFD 자료 및 제공 WAV 음원. 문장 번호와 무음 간격으로 분리한 음원입니다. 브라우저에서 스크립트 실행이 필요합니다. iPad 파일 미리보기에서 실행이 안 되면 MP3 묶음을 사용하세요.</footer></main><script src="sentences.js"></script><script src="app.js"></script></body></html>
